<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jardín Nocturno</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 🌌 CIELO -->
  <div class="sky">
    <span class="star"></span><span class="star"></span><span class="star"></span>
    <span class="star"></span><span class="star"></span><span class="star"></span>
    <span class="star"></span><span class="star"></span><span class="star"></span>
    <span class="star"></span><span class="star"></span><span class="star"></span>
    <span class="star"></span><span class="star"></span><span class="star"></span>
  </div>

  <!-- 🌱 SUELO -->
  <div class="ground"></div>

  <!-- 🌸 FLORES -->
  <div class="flowers">

    <div class="flower" data-poem="hogar">
      <div class="stem"></div>
      <div class="petal left"></div>
      <div class="petal center"></div>
      <div class="petal right"></div>
    </div>

    <div class="flower" data-poem="crecer">
      <div class="stem"></div>
      <div class="petal left"></div>
      <div class="petal center"></div>
      <div class="petal right"></div>
    </div>

    <div class="flower" data-poem="miles">
      <div class="stem"></div>
      <div class="petal left"></div>
      <div class="petal center"></div>
      <div class="petal right"></div>
    </div>

    <div class="flower" data-poem="luz">
      <div class="stem"></div>
      <div class="petal left"></div>
      <div class="petal center"></div>
      <div class="petal right"></div>
    </div>

    <div class="flower" data-poem="magia">
      <div class="stem"></div>
      <div class="petal left"></div>
      <div class="petal center"></div>
      <div class="petal right"></div>
    </div>

  </div>

  <!-- 🪟 MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <img id="modal-img" src="" alt="">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
